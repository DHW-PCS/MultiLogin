import groovy.json.JsonOutput
import org.apache.tools.ant.filters.ReplaceTokens
import java.security.MessageDigest
import java.text.SimpleDateFormat


plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.8.0' apply false
}

apply from: './constant.gradle'

def velocityBaselineVersion = providers.gradleProperty("velocity_baseline_version").get()
def velocityBaselineBuild = providers.gradleProperty("velocity_baseline_build").get()
def velocityBaselineSha256 = providers.gradleProperty("velocity_baseline_sha256").get()
def velocityBaselineUrl = providers.gradleProperty("velocity_baseline_url").get()
def velocityBaselineFile = layout.buildDirectory.file(
        "velocity-dependencies/velocity-${velocityBaselineVersion}-${velocityBaselineBuild}.jar"
)
def calculateSha256 = { File input ->
    def digest = MessageDigest.getInstance("SHA-256")
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

ext.velocityBaselineVersion = velocityBaselineVersion
ext.velocityBaselineFile = velocityBaselineFile

tasks.register("downloadVelocityBaseline") {
    description = "Downloads and verifies the pinned target Velocity server dependency."
    group = "build setup"

    inputs.property("url", velocityBaselineUrl)
    inputs.property("sha256", velocityBaselineSha256)
    outputs.file(velocityBaselineFile)
    outputs.upToDateWhen {
        def cachedFile = velocityBaselineFile.get().asFile
        cachedFile.isFile() && calculateSha256(cachedFile) == velocityBaselineSha256
    }

    doLast {
        def outputFile = velocityBaselineFile.get().asFile
        def temporaryFile = new File(outputFile.parentFile, "${outputFile.name}.part")
        outputFile.parentFile.mkdirs()
        temporaryFile.delete()

        try {
            new URI(velocityBaselineUrl).toURL().withInputStream { input ->
                temporaryFile.withOutputStream { output ->
                    output << input
                }
            }

            def actualSha256 = calculateSha256(temporaryFile)
            if (actualSha256 != velocityBaselineSha256) {
                throw new GradleException(
                        "Velocity baseline checksum mismatch: expected ${velocityBaselineSha256}, " +
                                "got ${actualSha256}"
                )
            }

            if (outputFile.exists() && !outputFile.delete()) {
                throw new GradleException("Could not replace cached Velocity baseline ${outputFile}")
            }
            if (!temporaryFile.renameTo(outputFile)) {
                throw new GradleException("Could not move verified Velocity baseline to ${outputFile}")
            }
        } finally {
            temporaryFile.delete()
        }
    }
}

allprojects {
    apply plugin: "java"
    def getGitCommitId = { ->
        try {
            def proc = "git rev-parse --short HEAD".execute()
            proc.waitFor()
            if (proc.exitValue() == 0) {
                return proc.in.text.trim()
            } else {
                return "unknown"
            }
        } catch (Exception e) {
            return "unknown"
        }
    }
    ext.gitCommitId = getGitCommitId()
    version = "${gitCommitId}"
}

subprojects {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        try (def scanner = new Scanner(file.repositories as File)) {
            while (scanner.hasNextLine()) {
                def line = scanner.nextLine()
                if (line.trim().length() == 0 || (line.charAt(0) as String) == '#') continue
                maven {
                    url line
                }
            }
        }
    }

    dependencies {
        compileOnly group: 'org.projectlombok', name: 'lombok', version: project.lombok_version
        annotationProcessor group: 'org.projectlombok', name: 'lombok', version: project.lombok_version

        compileOnly("org.jetbrains:annotations:24.1.0")
        annotationProcessor("org.jetbrains:annotations:24.1.0")

        try (def scanner = new Scanner(file.libraries as File)) {
            while (scanner.hasNextLine()) {
                def line = scanner.nextLine()
                if (line.trim().length() == 0 || (line.charAt(0) as String) == '#') continue
                def args = line.split("\\s+")
                compileOnly group: args[0], name: args[1], version: args[2]
            }
        }
    }

    processResources {
        setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)

        def contributors = new HashSet<String>()
        try (def scanner = new Scanner(file.contributors as File)) {
            while (scanner.hasNextLine()) {
                def line = scanner.nextLine()
                if (line.trim().length() == 0 || (line.charAt(0) as String) == '#') continue
                contributors.add(line)
            }
        }

        def ver;
        def env = System.getProperty("env", "AUTO").toLowerCase()
        if (env == "final") {
            ver = (project.plugin_version as String)
            if (!(ver ==~ /\d+\.\d+\.\d+-dhw/)) {
                throw new GradleException(
                        "Formal DHW-PCS versions must match <major>.<minor>.<patch>-dhw"
                )
            }
        } else {
            ver = "Build_" + version
        }

        filter ReplaceTokens, tokens: [
                "contributors_json": JsonOutput.toJson(contributors),
                "contributors"     : contributors.join(", "),
                "velocity_authors_json": JsonOutput.toJson([
                        "DHW Maintainers (originally developed by ${contributors.join(', ')})"
                ]),
                "version"          : ver,
                "build_type"       : env,
                "build_timestamp"  : System.currentTimeMillis() as String
        ]
    }

    jar {
        manifest {
            attributes(
                    'Built-By'       : System.properties['user.name'],
                    'Build-Timestamp': new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
                    'Build-Revision' : gitCommitId,
                    'Created-By'     : "Gradle ${gradle.gradleVersion}",
                    'Build-Jdk'      : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                    'Build-OS'       : "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
            )
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
        file.encoding = "UTF-8"
    }
}
