name: Build release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch Gradle Repositories
        run:
          sed -ni '/https:\/\/maven.aliyun.com\/repository\/public/{h;n;/https:\/\/repo1.maven.org\/maven2/!{:a;N;/https:\/\/maven.aliyun.com\/repository\/public/!ba;x;H;n};x;H;x};p' repositories

      - name: Read release version
        id: version
        run: echo "value=$(sed -n 's/^plugin_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Test and build release
        run: ./gradlew clean test shadowJar -Denv=final

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiLogin-Velocity-${{ steps.version.outputs.value }}
          path: velocity/build/libs/MultiLogin-Velocity-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error
