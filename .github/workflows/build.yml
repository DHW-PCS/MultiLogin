name: Build release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch Gradle Repositories
        run:
          sed -ni '/https:\/\/maven.aliyun.com\/repository\/public/{h;n;/https:\/\/repo1.maven.org\/maven2/!{:a;N;/https:\/\/maven.aliyun.com\/repository\/public/!ba;x;H;n};x;H;x};p' repositories

      - name: Read and validate release version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be built from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dhw$ ]]; then
            echo "::error::plugin_version must use the <major>.<minor>.<patch>-dhw format."
            exit 1
          fi

          artifact="velocity/build/libs/MultiLogin-Velocity-${version}.jar"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Test and build release
        run: ./gradlew clean test shadowJar -Denv=final

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiLogin-Velocity-${{ steps.version.outputs.value }}
          path: ${{ steps.version.outputs.artifact }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title "MultiLogin $RELEASE_VERSION" \
            --generate-notes \
            --latest
