plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {
        name 'papermc'
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    compileOnly project(":api")
    compileOnly project(":core")
    compileOnly project(":velocity")

    compileOnly 'io.netty:netty-all:4.1.86.Final'
    compileOnly 'net.minecrell:terminalconsoleappender:1.3.0'
    compileOnly "com.velocitypowered:velocity-api:${rootProject.ext.velocityBaselineVersion}"
    annotationProcessor "com.velocitypowered:velocity-api:${rootProject.ext.velocityBaselineVersion}"
    compileOnly files(rootProject.ext.velocityBaselineFile)

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation project(":api")
    testImplementation project(":core")
    testImplementation project(":velocity")
    testImplementation files(rootProject.ext.velocityBaselineFile)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

compileJava.dependsOn rootProject.tasks.named("downloadVelocityBaseline")
test.dependsOn rootProject.tasks.named("downloadVelocityBaseline")
test {
    useJUnitPlatform()
    def testRuntimeDirectory = layout.buildDirectory.dir("test-runtime")
    workingDir(testRuntimeDirectory)
    doFirst {
        testRuntimeDirectory.get().asFile.mkdirs()
    }
}

shadowJar {
    archiveFileName = 'MultiLogin-Velocity-Injector.JarFile'
}

artifacts {
    archives shadowJar
}
