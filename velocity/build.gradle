plugins {
    id 'com.gradleup.shadow' version '9.1.0'
}

repositories {
    maven {
        name 'papermc'
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    implementation project(":api")
    implementation project(":flows")
    implementation project(":loader")

    compileOnly 'io.netty:netty-all:4.1.86.Final'
    compileOnly 'net.minecrell:terminalconsoleappender:1.3.0'
    compileOnly "com.velocitypowered:velocity-api:${rootProject.ext.velocityBaselineVersion}"
    compileOnly files(rootProject.ext.velocityBaselineFile)

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation files(rootProject.ext.velocityBaselineFile)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

compileJava.dependsOn rootProject.tasks.named("downloadVelocityBaseline")
test.dependsOn rootProject.tasks.named("downloadVelocityBaseline")
test {
    useJUnitPlatform()
    def testRuntimeDirectory = layout.buildDirectory.dir("test-runtime")
    workingDir(testRuntimeDirectory)
    doFirst {
        testRuntimeDirectory.get().asFile.mkdirs()
    }
}

shadowJar {
    archiveBaseName.set('MultiLogin-Velocity')

    if (System.getProperty("env", "AUTO") == "final") {
        archiveVersion.set(project.plugin_version as String)
    } else {
        String ver = "Build_" + version
        archiveVersion.set(ver)
    }
    archiveClassifier.set("")
    from {
        project(':core').tasks.shadowJar.archiveFile
    }
    from {
        project(':velocity:injector').tasks.shadowJar.archiveFile
    }
}

artifacts {
    archives shadowJar
}
